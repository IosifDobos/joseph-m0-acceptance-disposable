name: Acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance-unit:
    name: acceptance-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node acceptance-test.mjs
